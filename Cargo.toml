[package]
name = "pikadick"
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
readme = "README.md"
description = "Yet another Discord bot"
authors = [ "adumbidiot <nathaniel.daniel23@outlook.com>" ]

[dependencies]
anyhow = "1.0.103"
argh = "0.1.19"
bewu-util = { git = "https://github.com/ThatAnnoyingKid/Bewu", version = "0.0.0", features = [ "async-timed-cache-cell", "async-timed-lru-cache", "async-mutex-map" ] }
bitflags = "2.13.0"
bytes = "1.12.0"
camino = { version = "1.2.4", features = [ "serde1" ] }
crossbeam = "0.8.4"
dashmap = "6.2.1"
deviantart = { git = "https://github.com/adumbidiot/deviantart-rs", default-features = false, features = [ "rustls-tls" ] }
futures = { version = "0.3.32", features = [ "std" ], default-features = false }
heim = { version = "0.1.0-rc.1", features = [ "cpu", "virt" ] }
indexmap = "2.14.0"
insta = { path = "./lib/insta-rs", default-features = false, features = [ "rustls" ] }
iqdb = { path = "./lib/iqdb-rs", default-features = false, features = [ "rustls" ] }
itoa = "1.0.18"
jiff = "0.2.29"
mimalloc = "0.1.52"
nd-async-rusqlite = { git = "https://github.com/nathaniel-daniel/nd-async-rusqlite-rs", version = "0.0.0", features = [ "bundled", "trace", "wal-pool", "fallible_uint" ] }
nd-util = { git = "https://github.com/nathaniel-daniel/nd-util-rs", features = [ "download-to-path", "drop-remove-path", "arc-anyhow-error" ] }
nekos = { path = "./lib/nekos-rs", default-features = false, features = [ "rustls" ] }
parking_lot = "0.12.5"
poise = "0.6.2"
pikadick-util = { path = "./lib/pikadick-util-rs", features = [ "async_lock_file", "request_map" ] }
pikadick-system-info = { path = "./lib/pikadick-system-info-rs" }
quizizz = { path = "./lib/quizizz-rs", default-features = false, features = [ "rustls" ] }
r6tracker = { path = "./lib/r6tracker-rs", default-features = false, features = [ "rustls" ] }
rand = "0.10.1"
reddit = { git = "https://github.com/nathaniel-daniel/reddit-rs", features = [ "rustls-tls" ], default-features = false }
reddit-tube = { path = "./lib/reddit-tube-rs", default-features = false, features = [ "rustls" ] }
regex = "1.12.4"
reqwest = { version = "0.13.4", default-features = false }
rule34 = { path = "./lib/rule34-rs", default-features = false, features = [ "rustls" ] }
rusqlite = { version = "0.40.1", features = [ "blob" ] }
ryu = "1.0.23"
sauce-nao = { git = "https://github.com/adumbidiot/sauce-nao-rs", default-features = false, features = [ "rustls-tls" ] }
serde = { version = "1.0.228", features = [ "derive" ] }
serenity = { version = "0.12.5", features = [ "client", "standard_framework", "rustls_backend", "voice", "cache", "unstable_discord_api" ], default-features = false }
songbird = { version = "0.6.0", features = [ "backend-mousiki" ] }
systemstat = "0.2.7"
thiserror = "2.0.18"
tic-tac-toe = { path = "lib/tic-tac-toe-rs" }
tikwm = { git = "https://github.com/adumbidiot/tiktok-rs", default-features = false, features = [ "rustls" ] }
time = "0.3.51"
tiny-skia = { version = "0.12.0", features = [ "std", "simd", "png-format" ], default-features = false }
tokio = { version = "1.52.3", features = [ "rt-multi-thread", "signal", "sync", "time", "parking_lot" ] }
tokio-ffmpeg-cli = { path = "./lib/tokio-ffmpeg-cli-rs" }
tokio-stream = "0.1.18"
toml = "1.1.2"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-log = "0.2.0"
tracing-subscriber = { version = "0.3.23", features = [ "env-filter", "fmt" ] }
uom = "=0.31.1"
urban-dictionary = { path = "./lib/urban-dictionary-rs", default-features = false, features = [ "rustls" ] }
url = "2.5.8"
xkcd = { path = "lib/xkcd-rs", default-features = false, features = [ "rustls" ] }
yodaspeak = { path = "lib/yodaspeak-rs", default-features = false, features = [ "rustls" ] }
zalgo = { git = "https://github.com/nathaniel-daniel/zalgo-rs", default-features = false }

# Optional
openssl = { version = "0.10.81", optional = true, features = [ "vendored" ] }
serde_json = "1.0.150"
skrifa = "0.44.0"

[features]
# Note: This is needed for cross comp
use-openssl-vendored = [ "openssl" ]

[lints.clippy]
# Deny
exit = "deny"
macro_use_imports = "deny"

# Warn
borrow_as_ptr = "warn"
case_sensitive_file_extension_comparisons = "warn"
cast_lossless = "warn"
cast_ptr_alignment = "warn"
cloned_instead_of_copied = "warn"
filetype_is_file = "warn"
filter_map_next = "warn"
flat_map_option = "warn"
fn_params_excessive_bools = "warn"
implicit_clone = "warn"
inefficient_to_string = "warn"
inconsistent_struct_constructor = "warn"
items_after_statements = "warn"
large_stack_arrays = "warn"
large_types_passed_by_value = "warn"
linkedlist = "warn"
lossy_float_literal = "warn"
manual_ok_or = "warn"
match_bool = "warn"
match_same_arms = "warn"
mut_mut = "warn"
mutex_atomic = "warn"
mutex_integer = "warn"
needless_for_each = "warn"
nonstandard_macro_braces = "warn"
path_buf_push_overwrite = "warn"
ptr_as_ptr = "warn"
rc_buffer = "warn"
rc_mutex = "warn"
redundant_else = "warn"
ref_binding_to_reference = "warn"
ref_option_ref = "warn"
semicolon_if_nothing_returned = "warn"
suboptimal_flops = "warn"
todo = "warn"
transmute_ptr_to_ptr = "warn"
trivially_copy_pass_by_ref = "warn"
try_err = "warn"
type_repetition_in_bounds = "warn"
unicode_not_nfc = "warn"
unnecessary_join = "warn"
unnested_or_patterns = "warn"
zero_sized_map_values = "warn"

# TODO: Consider if we want to deny this
# uninlined_format_args = "warn"

[patch.crates-io]
# Fix security advisory.
# heim = { git = "https://github.com/heim-rs/heim", rev = "b292f1535bb27c03800cdb7509fa81a40859fbbb" }
heim = { git = "https://github.com/vectordotdev/heim", branch = "update-nix" }

# Fix ntapi 0.3.0 not compiling on newer Rust versions.
ntapi3 = { version = "0.3.0", git = "https://github.com/MSxDOS/ntapi", rev = "2148881c30e8da6a3ff585efd1c7d8ad125ccd2c", package = "ntapi" }

# This allows us to use the pure-rust opus2 backend to make cross-compilation easier.
songbird = { git = "https://github.com/adumbidiot/songbird", branch = "opus2-backends" }

# To make image drawing times sane
[profile.dev.package.tiny-skia]
opt-level = 3

# To make image encoding times sane
[profile.dev.package.png]
opt-level = 3

# To make image encoding times sane
[profile.dev.package.miniz_oxide]
opt-level = 3

# To make image encoding times sane
[profile.dev.package.crc32fast]
opt-level = 3

# Causes build warning? "profile package spec `deflate` in profile `dev` did not match any packages"
# # To make image encoding times sane
# [profile.dev.package.deflate]
# opt-level = 3

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
strip = "symbols"

[profile.bench]
lto = "fat"
codegen-units = 1
opt-level = 3
strip = "symbols"

# A profile to use `cargo-bloat` with
[profile.release-cargo-bloat]
inherits = "release"
codegen-units = 1
debug = true
opt-level = 3
strip = false

[workspace]
resolver = "3"
members = [ 
    "lib/*"
]

[package.metadata.deb]
name = "pikadick"
depends = "ffmpeg"
assets = [
    [ "target/release/pikadick", "usr/bin/", "700" ],
    [ "deb-config.toml", "etc/pikadick/config.toml", "600" ],
]
conf-files = [
    "etc/pikadick/config.toml",
]
maintainer-scripts = "debian/"

[package.metadata.deb.systemd-units]
enable = true
start = true

[package.metadata.rpi-deploy]
targets = [
    "aarch64-unknown-linux-gnu",
    "armv7-unknown-linux-gnueabihf",
]
