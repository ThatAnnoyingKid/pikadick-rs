[package]
name = "nekos"
version = "0.0.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[[bin]]
name = "nekos"
path = "src/main.rs"
required-features = [ "cli" ]

[dependencies]
itoa = "1.0.18"
reqwest = { version = "0.13.5", default-features = false, features = [ "json" ] }
serde = { version = "1.0.229", features = [ "derive" ] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = [ "io-util" ] }
url = "2.5.8"

# Optional
argh = { version = "0.1.19", optional = true }
anyhow = { version = "1.0.104", optional = true }
nd-util = { git = "https://github.com/nathaniel-daniel/nd-util-rs", features = [ "download-to-path" ], optional = true }

[dev-dependencies]
tokio = { version = "1.54.1", features = [ "macros" ] }

[features]
default = [ "reqwest/rustls" ]

native-tls = [ "reqwest/native-tls" ]
rustls = [ "reqwest/rustls" ]

cli = [
    "argh",
    "anyhow",
    "nd-util",
    "tokio/fs",
    "tokio/rt-multi-thread",
]
