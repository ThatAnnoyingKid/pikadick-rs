[package]
name = "insta"
version = "0.0.0"
authors = [ "adumbidiot <nathaniel.daniel23@outlook.com>" ]
edition = "2021"
license = "MIT OR Apache-2.0"

[[bin]]
name = "insta"
path = "src/main.rs"
required-features = [ "cli" ]

[dependencies]
cookie_store = "0.22.1"
once_cell = "1.21.4"
regex = "1.12.4"
reqwest = { version = "0.13.4", features = [ "cookies", "gzip", "json" ], default-features = false }
reqwest_cookie_store = "0.10.0"
serde = { version = "1.0.228", features = [ "derive" ] }
serde_json = "1.0.150"
thiserror = "2.0.18"
url = { version = "2.5.8", features = [ "serde" ] }

# Optional
argh = { version = "0.1.19", optional = true }
anyhow = { version = "1.0.103", optional = true }
directories-next = { version = "2.0.0", optional = true }
tokio = { version = "1.52.3", optional = true }
toml_edit = { version = "0.25.12", optional = true }

[dev-dependencies]
tokio = { version = "1.52.3", features = [ "macros", "parking_lot" ] }

[features]
default = [ "reqwest/default-tls" ]

native-tls = [ "reqwest/native-tls" ]
rustls = [ "reqwest/rustls" ]

cli = [
    "argh",
    "anyhow",
    "directories-next",
    "tokio",
    "tokio/rt-multi-thread",
    "tokio/fs",
    "toml_edit",
]
