[package]
name = "yodaspeak"
version = "0.0.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[dependencies]
reqwest = { version = "0.13.4", features = [ "http2" ], default-features = false }
scraper = { version = "0.27.0", default-features = false}
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = [ "rt" ] }

[dev-dependencies]
tokio = { version = "1.52.3", features = [ "macros" ] }

[features]
default = [ "rustls", "system-proxy" ]

native-tls = [ "reqwest/native-tls" ]
rustls = [ "reqwest/rustls" ]

system-proxy = [ "reqwest/system-proxy" ]
