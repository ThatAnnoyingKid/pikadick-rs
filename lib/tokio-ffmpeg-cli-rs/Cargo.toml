[package]
name = "tokio-ffmpeg-cli"
version = "0.0.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[dependencies]
bitflags = "2.13.0"
futures = { version = "0.3.32", features = [ "std" ], default-features = false }
once_cell = "1.21.4"
regex = "1.12.4"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = [ "process" ] }
tokio-stream = { version = "0.1.18", features = [ "io-util" ] }
tracing = "0.1.44"

[dev-dependencies]
anyhow = "1.0.103"
tokio = { version = "1.52.3", features = [ "rt", "macros" ] }
