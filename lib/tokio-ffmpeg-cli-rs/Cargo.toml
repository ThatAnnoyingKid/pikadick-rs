[package]
name = "tokio-ffmpeg-cli"
version = "0.0.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[dependencies]
bitflags = "2.13.2"
futures = { version = "0.3.34", features = [ "std" ], default-features = false }
once_cell = "1.21.4"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = [ "process" ] }
tokio-stream = { version = "0.1.19", features = [ "io-util" ] }
tracing = "0.1.44"

[dev-dependencies]
anyhow = "1.0.104"
tokio = { version = "1.54.1", features = [ "rt", "macros" ] }
