[package]
name = "pikadick-system-info"
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[dependencies]
cfg-if = "1.0.5"
once_cell = "1.21.4"
platforms = "4.2.1"
thiserror = "2.0.21"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61.2", features = [ "Win32_System_SystemInformation", "Win32_System_WindowsProgramming", "Win32_Foundation", "Win32_System_Diagnostics_Debug", "Win32_System_SystemServices", "Win32_System_Threading", "Wdk_System_SystemServices", "Win32_System_ProcessStatus" ] }
bitflags = "2.13.2"

[target.'cfg(target_os = "linux")'.dependencies]
nix = { version = "0.31.3", features = [ "hostname", "feature" ], default-features = false }
libc = "0.2.191"

[dev-dependencies]
time = { version = "0.3.55", features = [ "local-offset" ] }
