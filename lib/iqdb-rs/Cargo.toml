[package]
name = "iqdb"
version = "0.0.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[[bin]]
name = "iqdb"
path = "src/main.rs"
required-features = [ "cli" ]

[dependencies]
lazy_static = "1.5.1"
reqwest = { version = "0.13.5", default-features = false, features = [ "multipart", "stream" ] }
scraper = { version = "0.27.0", default-features = false }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = [ "fs", "rt" ] }
tokio-util = { version = "0.7.20", features = ["codec"] }
url = "2.5.8"

# Optional
anyhow = { version = "1.0.104", optional = true }
argh = { version = "0.1.19", optional = true }

[dev-dependencies]
tokio = { version = "1.54.1", features = [ "macros" ] }

[features]
default = [ "reqwest/default-tls" ]

native-tls = [ "reqwest/native-tls" ]
rustls = [ "reqwest/rustls" ]

cli = [
    "anyhow",
    "argh",
    "tokio/rt-multi-thread",
]
