[package]
name = "rule34"
version = "0.0.0"
authors = [ "ProfessionalProgrammers <rusty.bois.bios.rusty@gmail.com>" ]
edition = "2024"
license = "MIT OR Apache-2.0"

[[bin]]
name = "rule34"
required-features = [ "cli" ]
path = "src/cli/main.rs"

[dependencies]
itoa = "1.0.18"
quick-xml = { version = "0.41.0", features = [ "serialize" ] }
reqwest = { version = "0.13.5", default-features = false, features = [ "json", "brotli", "http2" ] }
serde = { version = "1.0.229", features = [ "derive" ] }
thiserror = "2.0.21"
time = { version = "0.3.55", features = [ "serde", "parsing", "formatting", "macros" ], default-features = false }
tokio = "1.54.1"
url = { version = "2.5.8", features = [ "serde" ] }
serde_json = "1.0.154"

# scrape
once_cell = { version = "1.21.4", features = [ "std" ], default-features = false, optional = true }
scraper = { version = "0.27.0", default-features = false, optional = true }

# cli
argh = { version = "0.1.19", optional = true }
anyhow = { version = "1.0.104", optional = true }
nd-util = { git = "https://github.com/nathaniel-daniel/nd-util-rs", features = [ "download-to-path" ], optional = true }

[dev-dependencies]
tokio = { version = "1.54.1", features = [ "macros", "rt-multi-thread" ] }
serde_path_to_error = "0.1.20"

[features]
# Use reqwest's default by default.
default = ["default-tls"]

# Use the default TLS for this platform. 
# This is reqwest's default.
default-tls = ["reqwest/default-tls"]

# Use native-tls for TLS
native-tls = ["reqwest/native-tls"]

# Use rustls for TLS
rustls = ["reqwest/rustls"]

# Whether to include API functions that use scraping.
# Omitting this feature reduces the number of dependencies.
scrape = ["scraper", "once_cell"]

# Whether to enable the CLI
cli = ["argh", "anyhow", "tokio/rt-multi-thread", "tokio/fs", "nd-util", "scrape"]
