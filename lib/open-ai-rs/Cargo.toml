[package]
name = "open-ai"
version = "0.0.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[dependencies]
reqwest = { version = "0.13.4", features = [ "json" ], default-features = false }
serde = { version = "1.0.228", features = ["derive"] }
thiserror = "2.0.18"

[dev-dependencies]
once_cell = "1.21.4"
serde_json = "1.0.150"
tokio = { version = "1.52.3", features = ["macros"] }

[features]
default = ["rustls"]
native-tls = ["reqwest/native-tls"]
rustls = ["reqwest/rustls"]
